<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head><meta charset="utf-8"><title>ایکون‌های Payam Logger</title>
<style>
  body { font-family: system-ui, sans-serif; background: #ddd; margin: 0; padding: 30px; }
  .light, .dark { padding: 24px; border-radius: 14px; margin-bottom: 24px; }
  .light { background: #fff; }
  .dark  { background: #1a1b1e; }
  h2 { margin: 0 0 14px; font-size: 15px; }
  .grid { display: flex; gap: 40px; align-items: flex-end; flex-wrap: wrap; }
  .cell { text-align: center; }
  .cell img { display: block; margin: 0 auto 6px; }
  .cell span { font-size: 11px; color: #888; direction: ltr; }
  .label { font-size: 18px; font-weight: 700; margin: 26px 0 6px; color: #c01b24; }
  .light .label { color: #a0171f; }
</style>
</head>
<body>
  <div class="light">
    <div class="label">طرح A — تایم‌لاین سه‌ردیفه</div>
    <div class="grid">
      <div class="cell"><img src="variant-a.svg" width="128"><span>128</span></div>
      <div class="cell"><img src="variant-a.svg" width="64"><span>64</span></div>
      <div class="cell"><img src="variant-a.svg" width="32"><span>32</span></div>
      <div class="cell"><img src="variant-a.svg" width="16"><span>16</span></div>
    </div>
  </div>

  <div class="dark">
    <div class="label" style="color:#ff888e">طرح B — ساعت + تایم‌لاین</div>
    <div class="grid">
      <div class="cell"><img src="variant-b.svg" width="128"><span>128</span></div>
      <div class="cell"><img src="variant-b.svg" width="64"><span>64</span></div>
      <div class="cell"><img src="variant-b.svg" width="32"><span>32</span></div>
      <div class="cell"><img src="variant-b.svg" width="16"><span>16</span></div>
    </div>
  </div>

  <div class="light">
    <div class="label">طرح C — مینیمال</div>
    <div class="grid">
      <div class="cell"><img src="variant-c.svg" width="128"><span>128</span></div>
      <div class="cell"><img src="variant-c.svg" width="64"><span>64</span></div>
      <div class="cell"><img src="variant-c.svg" width="32"><span>32</span></div>
      <div class="cell"><img src="variant-c.svg" width="16"><span>16</span></div>
    </div>
  </div>
</body>
</html>
