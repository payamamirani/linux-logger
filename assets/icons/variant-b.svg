<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- طرح B: ساعت + دستِ تایم‌لاین -->
  <defs>
    <linearGradient id="bgB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c2e34"/>
      <stop offset="1" stop-color="#161719"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="30" fill="url(#bgB)"/>
  <!-- صفحه ساعت -->
  <circle cx="64" cy="64" r="42" fill="none" stroke="#e8e8e8" stroke-width="7"/>
  <!-- تیک‌های ۱۲/۳/۶/۹ -->
  <g stroke="#e8e8e8" stroke-width="5" stroke-linecap="round">
    <line x1="64" y1="28" x2="64" y2="36"/>
    <line x1="64" y1="92" x2="64" y2="100"/>
    <line x1="28" y1="64" x2="36" y2="64"/>
    <line x1="92" y1="64" x2="100" y2="64"/>
  </g>
  <!-- دست ساعت: تایم‌لاین سگمنتی افقی -->
  <rect x="33" y="58" width="17" height="12" rx="6" fill="#26a269"/>
  <rect x="54" y="58" width="31" height="12" rx="6" fill="#3584e4"/>
  <circle cx="64" cy="64" r="7.5" fill="#ffffff"/>
</svg>
